services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patients
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local_demo_only
    volumes:
      - patient_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d patients"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://demo:local_demo_only@db:5432/patients
      API_KEY: ${API_KEY:-}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  patient_data:
