[project]
name = "patient-registration-voice-agent"
version = "1.0.0"
description = "Vapi patient intake with validated, confirmation-gated persistence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic[email]>=2.9,<3", "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

